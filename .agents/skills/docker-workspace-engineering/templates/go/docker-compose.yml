services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: app-dev
    restart: unless-stopped
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true

  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: .env
        required: false
    entrypoint: ["go"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: .env
        required: false

volumes:
  go-mod-cache:
  go-build-cache:
