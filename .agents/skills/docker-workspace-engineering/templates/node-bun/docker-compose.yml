services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: app-dev
    restart: unless-stopped
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - node-modules-isolation:/workspace/app/node_modules
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - node-modules-isolation:/workspace/app/node_modules
    env_file:
      - path: .env
        required: false
    entrypoint: ["npm"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - node-modules-isolation:/workspace/app/node_modules
    env_file:
      - path: .env
        required: false

volumes:
  node-modules-isolation:
