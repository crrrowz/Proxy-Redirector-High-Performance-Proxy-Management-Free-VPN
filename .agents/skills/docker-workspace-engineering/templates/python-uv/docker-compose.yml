services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: app-dev
    restart: unless-stopped
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - venv-isolation:/workspace/app/.venv
      - uv-cache:/root/.cache/uv
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - venv-isolation:/workspace/app/.venv
      - uv-cache:/root/.cache/uv
    env_file:
      - path: .env
        required: false
    entrypoint: ["python"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /workspace/app
    volumes:
      - .:/workspace/app
      - venv-isolation:/workspace/app/.venv
      - uv-cache:/root/.cache/uv
    env_file:
      - path: .env
        required: false

volumes:
  venv-isolation:
  uv-cache:
